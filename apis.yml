name: Zepto
description: 'Zepto (Zepto Marketplace Private Limited) is an Indian quick-commerce grocery
  delivery company founded in 2021 that delivers groceries, fresh fruits and vegetables, meat,
  pet care, beauty and household products "in minutes" from a network of dark stores across major
  Indian cities. It operates a consumer-facing mobile app and website (zepto.com, formerly
  zeptonow.com) and publishes no public developer API, developer portal, or API documentation;
  its partner-facing surfaces are limited to merchant onboarding (Sell on Zepto / brands.zepto.co.in),
  delivery-partner and franchise programs. Backed by General Catalyst, Lightspeed Venture Partners
  and Y Combinator.'
